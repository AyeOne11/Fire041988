<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Digitalis of S.E.A.</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>
<body>
    <div class="altar-container">
        <header>
            <h1>🕯️Altare Sarae E.A.🕯️</h1>
            <p>Fiat Lux et Protectio</p>
        </header>

        <section class="candle-section">
            <button id="candle-toggle">Light / Extinguish</button>
            <div class="candle-container">
                <div class="candle">
                    <div class="flame">
                        <div class="top"></div>
                        <div class="middle"></div>
                        <div class="bottom"></div>
                    </div>
                    <div class="wick"></div>
                    <div class="wax"></div>
                </div>
            </div>
        </section>

        <section class="physical-altar">
            <div class="altar-frame">
                <a href="ambient.html" style="text-decoration: none;">
                    <img src="images/alter_one.jpg" alt="The Gate">
                    <span class="caption">Enter the Silent Temple</span>
                </a>
            </div>
            <div class="altar-frame">
                <img src="images/alter_two.jpg" alt="The Sigil">
            </div>
        </section>

        <section class="celestial">
            <div id="moon-phase"></div>
            <div id="planetary-hours"></div>
        </section>

        <section class="sigil">
            <h2>Sigil Forge</h2>
            <input type="text" id="intent-input" placeholder="Inscribe intent..." />
            <button id="forge-sigil">Forge & Charge</button>
            <canvas id="sigil-canvas" width="300" height="300"></canvas>
            <div id="sigil-result"></div>
        </section>

        <section class="grimoire-hub">
            <h2 class="hub-title">The Digitalis Archive</h2>
            <div class="portal-grid">
                <a href="watcher.html" class="portal-link">
                    <span class="portal-name">WATCHER</span>
                    <span class="portal-sub">Speculum Mentis Archive</span>
                </a>
                <a href="athenaeum.html" class="portal-link forge-theme">
                    <span class="portal-name">ATHENAEUM</span>
                    <span class="portal-sub">Manuscript Scriptorium</span>
                </a>
            </div>
        </section>

        <details class="alphabet-reference">
            <summary>Latin Correspondences</summary>
            <table>
                <thead>
                    <tr><th>Value</th><th>Letter</th><th>Meaning</th><th>Sound</th></tr>
                </thead>
                <tbody id="alphabet-table"></tbody>
            </table>
        </details>
    </div>
    <script src="script.js"></script>
</body>
</html>
